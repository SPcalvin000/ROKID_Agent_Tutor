<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雅思 Agent 后端联调模拟器</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f5f7fa; color: #333; }
        .container { display: flex; gap: 20px; max-width: 1200px; margin: 0 auto; }
        .panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex: 1; }
        h2 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, input[type="text"], input[type="file"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #3498db; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; font-weight: bold; width: 100%; }
        button:hover { background-color: #2980b9; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        .log-box { background: #1e1e1e; color: #00ff00; font-family: monospace; padding: 10px; border-radius: 4px; height: 400px; overflow-y: auto; white-space: pre-wrap; font-size: 13px; margin-top: 10px;}
        .log-error { color: #ff6b6b; }
        .log-send { color: #4da8da; }
        .status-indicator { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background-color: red; margin-right: 5px;}
        .status-connected { background-color: #2ecc71; }
    </style>
</head>
<body>

<div class="container">
    <div class="panel">
        <h2>控制面板 <span id="ws-status" style="font-size: 14px; font-weight: normal; float: right;">🔴 未连接</span></h2>

        <div class="form-group">
            <label>后端 WebSocket 地址:</label>
            <input type="text" id="ws-url" value="ws://127.0.0.1:8765">
            <button onclick="connectWS()" id="btn-connect" style="margin-top: 5px; background-color: #2ecc71;">连接服务器</button>
        </div>
        <div class="form-group">
            <label>⭐ 选择目标助手模块 (Agent Type):</label>
            <select id="agent-type" style="border: 2px solid #3498db; font-weight: bold;">
                <option value="ielts_speaking">🗣️ 口语助手 (IELTS)</option>
                <option value="essay_grading">✍️ 批改助手 (Essay)</option>
                <option value="note_assistant">📝 笔记助手 (Notes)</option>
            </select>
        </div>
        <div class="form-group">
            <label>1. 选择触发的功能模块 (Event Type):</label>
            <select id="event-type">
                <option value="upload_image">📸 上传图像 (触发 VLM 模块)</option>
                <option value="upload_audio">🎙️ 上传音频 (触发 ASR 模块)</option>
                <option value="text_chat">💬 纯文本对话 (预留)</option>
            </select>
        </div>

        <div class="form-group">
            <label>2. 附加文件 (模拟摄像头/麦克风截取的数据):</label>
            <input type="file" id="file-input">
        </div>
        <div class="form-group" style="background: #e8f4f8; padding: 10px; border-radius: 4px;">
            <label>🎙️ 全双工语音测试：使用网页麦克风录音发送</label>
            <div style="display: flex; gap: 10px; margin-top: 5px;">
                <button id="btn-start-record" onclick="startRecording()" style="background-color: #e74c3c; width: 50%;">🔴 按住/点击 开始录音</button>
                <button id="btn-stop-record" onclick="stopRecording()" disabled style="background-color: #95a5a6; width: 50%;">⏹️ 停止并发送</button>
            </div>
            <span id="record-status" style="font-size: 12px; color: #555; margin-top: 5px; display: block;">录音状态: 待机</span>
        </div>


<!-- 🌟 新增：文本直达测试与会话控制 -->
        <div class="form-group" style="background: #fdf2e9; padding: 10px; border-radius: 4px; margin-top: 15px;">
            <label>⌨️ 开发者直达：纯文本测试 (跳过录音识别)</label>
            <div style="display: flex; gap: 10px; margin-top: 5px;">
                <input type="text" id="text-input" placeholder="输入你想假装说出的英文回答..." style="flex: 1;">
                <button onclick="sendTextPayload()" style="background-color: #f39c12; width: 100px;">🚀 发送</button>
            </div>

            <div style="margin-top: 15px; border-top: 1px dashed #ccc; padding-top: 10px;">
                <label>🛠️ 会话控制</label>
                <button onclick="clearSession()" style="background-color: #c0392b; width: 100%;">💣 强行结束/清空当前对话</button>
                <span id="session-status" style="font-size: 12px; color: #555; margin-top: 5px; display: block;">状态: 正常</span>
            </div>
        </div>


        <div class="form-group">
            <label>Session ID (模拟当前用户):</label>
            <input type="text" id="session-id" value="test_user_001">
        </div>

        <button onclick="sendPayload()" id="btn-send" disabled>构造 JSON 包并发送</button>
    </div>

    <div class="panel">
        <h2>输入输出日志 (JSON 数据流)</h2>
        <div id="log-console" class="log-box">等待操作...</div>
    </div>
</div>

<script>
    let ws = null;
    const logConsole = document.getElementById('log-console');
    const btnSend = document.getElementById('btn-send');
    const wsStatus = document.getElementById('ws-status');

    function log(msg, type='normal') {
        const time = new Date().toLocaleTimeString();
        let colorClass = '';
        if(type === 'error') colorClass = 'log-error';
        if(type === 'send') colorClass = 'log-send';
        logConsole.innerHTML += `<span class="${colorClass}">[${time}] ${msg}</span>\n`;
        logConsole.scrollTop = logConsole.scrollHeight;
    }

    function connectWS() {
        const url = document.getElementById('ws-url').value;
        log(`正在连接到 ${url}...`);
        ws = new WebSocket(url);

        ws.onopen = () => {
            log('🟢 成功连接到后端服务器！');
            wsStatus.innerHTML = '🟢 已连接';
            btnSend.disabled = false;
        };

        ws.onmessage = (event) => {
            log(`⬇️ 收到后端响应:\n${JSON.stringify(JSON.parse(event.data), null, 2)}`);
        };

        ws.onclose = () => {
            log('🔴 与服务器断开连接。', 'error');
            wsStatus.innerHTML = '🔴 未连接';
            btnSend.disabled = true;
        };

        ws.onerror = (err) => {
            log(`❌ WebSocket 发生错误。请确认后端 Python 脚本正在运行。`, 'error');
        };
    }

    // 核心发包逻辑
    function sendPayload() {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            alert('请先连接 WebSocket 服务器！');
            return;
        }

        const agentType = document.getElementById('agent-type').value; // 新增获取 agent_type
        const eventType = document.getElementById('event-type').value;
        const sessionId = document.getElementById('session-id').value;
        const fileInput = document.getElementById('file-input');

        // 构造基础 JSON 信封
        const payloadJson = {
            agent_type: agentType,  // 告诉后端找哪个
            event_type: eventType,
            session_id: sessionId,
            timestamp: Date.now(),
            payload: {}
        };

        if (fileInput.files.length > 0) {
            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                // FileReader 读出来的是 data:image/jpeg;base64,xxxxxx 的格式
                // 我们只需要逗号后面的纯 Base64 字符串
                const base64Data = e.target.result.split(',')[1];

                payloadJson.payload.data = base64Data;
                payloadJson.payload.filename = file.name;

                // 发送 JSON 字符串
                ws.send(JSON.stringify(payloadJson));
                log(`⬆️ 发送 JSON 请求包 (附带文件):\n${JSON.stringify(payloadJson, null, 2)}`, 'send');
            };
            // 将文件读取为 Data URL (Base64)
            reader.readAsDataURL(file);
        } else {
            // 没有附件的情况
            ws.send(JSON.stringify(payloadJson));
            log(`⬆️ 发送 JSON 请求包 (无文件):\n${JSON.stringify(payloadJson, null, 2)}`, 'send');
        }
    }
    // ================= 语音录制与发送逻辑 =================
    let mediaRecorder;
    let audioChunks = [];

    async function startRecording() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];

            mediaRecorder.ondataavailable = event => {
                if (event.data.size > 0) {
                    audioChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = async () => {
                document.getElementById('record-status').innerText = '录音状态: 正在处理并发送...';

                // 将录音合并为 WebM Blob
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });

                // 转 Base64 发送
                const reader = new FileReader();
                reader.readAsDataURL(audioBlob);
                reader.onloadend = function() {
                    const base64Audio = reader.result.split(',')[1];
                    sendAudioPayload(base64Audio);
                };

                // 释放麦克风资源
                stream.getTracks().forEach(track => track.stop());
            };

            mediaRecorder.start();

            // 更新 UI
            document.getElementById('btn-start-record').disabled = true;
            document.getElementById('btn-start-record').style.backgroundColor = '#95a5a6';
            document.getElementById('btn-stop-record').disabled = false;
            document.getElementById('btn-stop-record').style.backgroundColor = '#2ecc71';
            document.getElementById('record-status').innerText = '录音状态: 🔴 正在录音中... (请说话)';

        } catch (err) {
            log(`❌ 无法访问麦克风: ${err.message}`, 'error');
            alert('请确保浏览器允许了麦克风权限，或处于 localhost/HTTPS 环境下运行。');
        }
    }

    function stopRecording() {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();

            // 恢复 UI
            document.getElementById('btn-start-record').disabled = false;
            document.getElementById('btn-start-record').style.backgroundColor = '#e74c3c';
            document.getElementById('btn-stop-record').disabled = true;
            document.getElementById('btn-stop-record').style.backgroundColor = '#95a5a6';
        }
    }

    function sendAudioPayload(base64Data) {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            alert('请先连接 WebSocket 服务器！');
            return;
        }

        const agentType = document.getElementById('agent-type').value;
        const sessionId = document.getElementById('session-id').value;

        // 构造强制触发 ASR 的 JSON 包
        const payloadJson = {
            agent_type: agentType,
            event_type: "upload_audio",  // 强制走音频通道
            session_id: sessionId,
            timestamp: Date.now(),
            payload: {
                data: base64Data,
                format: "webm"
            }
        };

        ws.send(JSON.stringify(payloadJson));
        log(`⬆️ 发送语音包: 音频长度 ${base64Data.length} (Base64)`, 'send');
        document.getElementById('record-status').innerText = '录音状态: 已发送，等待考官回复...';
    }

    // ================= 🌟 文本直达与会话控制 =================
    function sendTextPayload() {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            alert('请先连接 WebSocket 服务器！');
            return;
        }
        const text = document.getElementById('text-input').value;
        if (!text) {
            alert('请输入测试文本！');
            return;
        }

        const payloadJson = {
            agent_type: document.getElementById('agent-type').value,
            event_type: "text_chat", // 触发后端纯文本接口
            session_id: document.getElementById('session-id').value,
            timestamp: Date.now(),
            payload: { text: text }
        };

        ws.send(JSON.stringify(payloadJson));
        log(`⬆️ 发送纯文本: "${text}"`, 'send');
        document.getElementById('text-input').value = ''; // 清空输入框
    }

    function clearSession() {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            alert('请先连接 WebSocket 服务器！');
            return;
        }
        const payloadJson = {
            agent_type: document.getElementById('agent-type').value,
            event_type: "clear_session", // 触发后端清除 Redis 接口
            session_id: document.getElementById('session-id').value,
            timestamp: Date.now(),
            payload: {}
        };
        ws.send(JSON.stringify(payloadJson));
        log(`⬆️ 发送指令: 清除 Redis 会话缓存`, 'send');
    }


</script>
</body>
</html>
